# Render Blueprint: web service Docker (gói Free).
# Mặc định dùng SQLite nhúng (dữ liệu mẫu tự tạo lại mỗi lần khởi động).
# Muốn dữ liệu lâu dài: tạo PostgreSQL trên Render rồi thêm biến DATABASE_URL (Internal Database URL).
services:
  - type: web
    name: webbanhoa
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DB_PROVIDER
        value: sqlite
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DemoPay__Secret
        generateValue: true
      # Điền khi có tài khoản merchant VNPay sandbox (để trống = dùng cổng mô phỏng)
      - key: VnPay__TmnCode
        sync: false
      - key: VnPay__HashSecret
        sync: false
