<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 630' width='980' height='630' font-family='Segoe UI, Arial, sans-serif'><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0 0L10 5L0 10z' fill='#2A2220'/></marker><marker id='open' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' orient='auto'><path d='M0 0L10 5L0 10' fill='none' stroke='#2A2220'/></marker></defs><rect width='980' height='630' fill='#fff'/><text x='490' y='30' text-anchor='middle' font-size='18' font-weight='700' fill='#2A2220'>Sơ đồ tuần tự thanh toán online VNPay</text><rect x='30' y='50' width='160' height='40' rx='8' fill='#FFF6F5' stroke='#C8506A' stroke-width='1.6'/><text x='110' y='75' text-anchor='middle' font-size='14' font-weight='700' fill='#2A2220'>Khách hàng</text><line x1='110' y1='90' x2='110' y2='610' stroke='#8C7F79' stroke-dasharray='5 5'/><rect x='300' y='50' width='160' height='40' rx='8' fill='#FFF6F5' stroke='#C8506A' stroke-width='1.6'/><text x='380' y='75' text-anchor='middle' font-size='14' font-weight='700' fill='#2A2220'>Website Floria</text><line x1='380' y1='90' x2='380' y2='610' stroke='#8C7F79' stroke-dasharray='5 5'/><rect x='540' y='50' width='160' height='40' rx='8' fill='#FFF6F5' stroke='#C8506A' stroke-width='1.6'/><text x='620' y='75' text-anchor='middle' font-size='14' font-weight='700' fill='#2A2220'>CSDL</text><line x1='620' y1='90' x2='620' y2='610' stroke='#8C7F79' stroke-dasharray='5 5'/><rect x='780' y='50' width='160' height='40' rx='8' fill='#FFF6F5' stroke='#C8506A' stroke-width='1.6'/><text x='860' y='75' text-anchor='middle' font-size='14' font-weight='700' fill='#2A2220'>Cổng VNPay</text><line x1='860' y1='90' x2='860' y2='610' stroke='#8C7F79' stroke-dasharray='5 5'/><line x1='110' y1='125' x2='380' y2='125' stroke='#2A2220' stroke-width='1.4' marker-end='url(#arr)'/><text x='245.0' y='118' text-anchor='middle' font-size='12.5' fill='#2A2220'>1. Đặt hàng, chọn thanh toán VNPay</text><line x1='380' y1='173' x2='620' y2='173' stroke='#2A2220' stroke-width='1.4' marker-end='url(#arr)'/><text x='500.0' y='166' text-anchor='middle' font-size='12.5' fill='#2A2220'>2. Lưu đơn (Chờ xác nhận, Chưa thanh toán)</text><path d='M380 213 h50 v18 h-46' fill='none' stroke='#2A2220' stroke-width='1.4' marker-end='url(#arr)'/><text x='438' y='225' font-size='12.5' fill='#2A2220'>3. Tạo URL thanh toán + ký HMAC-SHA512</text><line x1='380' y1='269' x2='110' y2='269' stroke='#2A2220' stroke-width='1.4' stroke-dasharray="6 4" marker-end='url(#arr)'/><text x='245.0' y='262' text-anchor='middle' font-size='12.5' fill='#2A2220'>4. Chuyển hướng tới cổng VNPay</text><line x1='110' y1='317' x2='860' y2='317' stroke='#2A2220' stroke-width='1.4' marker-end='url(#arr)'/><text x='485.0' y='310' text-anchor='middle' font-size='12.5' fill='#2A2220'>5. Chọn ngân hàng, nhập thẻ, OTP</text><line x1='860' y1='365' x2='380' y2='365' stroke='#2A2220' stroke-width='1.4' marker-end='url(#arr)'/><text x='620.0' y='358' text-anchor='middle' font-size='12.5' fill='#2A2220'>6. Redirect ReturnUrl kèm vnp_SecureHash</text><path d='M380 405 h50 v18 h-46' fill='none' stroke='#2A2220' stroke-width='1.4' marker-end='url(#arr)'/><text x='438' y='417' font-size='12.5' fill='#2A2220'>7. Kiểm tra chữ ký, số tiền, mã phản hồi</text><line x1='380' y1='461' x2='620' y2='461' stroke='#2A2220' stroke-width='1.4' marker-end='url(#arr)'/><text x='500.0' y='454' text-anchor='middle' font-size='12.5' fill='#2A2220'>8. Lưu giao dịch, cập nhật Đã thanh toán</text><line x1='860' y1='509' x2='380' y2='509' stroke='#2A2220' stroke-width='1.4' stroke-dasharray="6 4" marker-end='url(#arr)'/><text x='620.0' y='502' text-anchor='middle' font-size='12.5' fill='#2A2220'>9. IPN xác nhận (server-to-server)</text><line x1='380' y1='557' x2='110' y2='557' stroke='#2A2220' stroke-width='1.4' stroke-dasharray="6 4" marker-end='url(#arr)'/><text x='245.0' y='550' text-anchor='middle' font-size='12.5' fill='#2A2220'>10. Hiển thị kết quả thanh toán</text></svg>